<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Макеты системы учёта заказов</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Система учёта заказов</h1>
    <p>Макеты основных экранов</p>
  </header>

  <main>
    <section class="screen">
      <h2>Вход</h2>
      <form class="form">
        <label>Email<input type="email" placeholder="mail@example.com"></label>
        <label>Пароль<input type="password" placeholder="Введите пароль"></label>
        <button type="button">Войти</button>
        <a href="#">Зарегистрироваться</a>
      </form>
    </section>

    <section class="screen wide">
      <div class="toolbar">
        <h2>Заказы</h2>
        <button type="button">Создать заказ</button>
      </div>
      <label class="filter">Статус
        <select>
          <option>Все</option>
          <option>Новый</option>
          <option>В работе</option>
          <option>Выполнен</option>
        </select>
      </label>
      <table>
        <thead>
          <tr><th>Название</th><th>Срок</th><th>Стоимость</th><th>Статус</th><th>Действия</th></tr>
        </thead>
        <tbody>
          <tr>
            <td>Создать логотип</td><td>20.10.2026</td><td>5 000 ₽</td><td>Новый</td>
            <td class="actions"><button type="button">Изменить</button><button class="danger" type="button">Удалить</button></td>
          </tr>
          <tr>
            <td>Оформить презентацию</td><td>25.10.2026</td><td>3 000 ₽</td><td>В работе</td>
            <td>Изменение недоступно</td>
          </tr>
        </tbody>
      </table>
    </section>

    <section class="screen">
      <h2>Создание / изменение заказа</h2>
      <form class="form">
        <label>Название<input type="text" placeholder="Название заказа"></label>
        <label>Описание<textarea placeholder="Что нужно сделать"></textarea></label>
        <label>Срок<input type="date"></label>
        <label>Стоимость<input type="number" placeholder="0"></label>
        <button type="button">Сохранить</button>
      </form>
    </section>

    <section class="screen">
      <h2>Профиль</h2>
      <form class="form">
        <label>Имя<input type="text" value="Анна Иванова"></label>
        <label>Email<input type="email" value="anna@example.com"></label>
        <label>Роль<input type="text" value="Заказчик" disabled></label>
        <button type="button">Сохранить</button>
      </form>
    </section>
  </main>
</body>
</html>
