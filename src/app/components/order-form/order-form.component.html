<section class="card small">
  <h1>{{ orderId ? 'Изменение заказа' : 'Новый заказ' }}</h1>
  <form (ngSubmit)="save()">
    <label>Название<input name="title" [(ngModel)]="form.title" required></label>
    <label>Описание<textarea name="description" [(ngModel)]="form.description" required></textarea></label>
    <label>Срок<input type="date" name="deadline" [(ngModel)]="form.deadline" required></label>
    <label>Стоимость<input type="number" name="price" [(ngModel)]="form.price" min="1" required></label>
    <button type="submit">Сохранить</button>
    <a class="button secondary" routerLink="/orders">Отмена</a>
  </form>
</section>
